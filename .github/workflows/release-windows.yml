name: TurtleClient Windows release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'services/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turtleclient-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            installer/bootstrap/target
          key: windows-release-${{ hashFiles('src-tauri/Cargo.lock', 'installer/bootstrap/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-release-${{ hashFiles('src-tauri/Cargo.lock', 'installer/bootstrap/Cargo.lock') }}-
            windows-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: bun install --frozen-lockfile
      - name: Bundle the verified Microsoft sign-in provider
        run: |
          pwsh -NoProfile -File scripts/prepare-account-provider.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/prepare-resources.ps1
      - name: Verify updater and connection behavior
        run: bun scripts/test.mjs updater.test updatePolicy.test remoteUi.test friendsConnection.test turtle-release.test onboarding.test turtleGeometry.test turtleTag.test turtleWardrobeRules.test minecraftSkinCache.test textureSource.test lobbyLook.test deviceTier.test gpuLite.test slowLite.test serviceLoginError.test
      - name: Set monotonically increasing release version
        id: version
        run: bun scripts/turtle-release.mjs prepare
      - name: Verify and build the native Turtle bootstrap
        run: |
          cargo fmt --manifest-path installer/bootstrap/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path installer/bootstrap/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path installer/bootstrap/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path installer/bootstrap/Cargo.toml --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path installer/dist -Force | Out-Null
          Copy-Item installer/bootstrap/target/release/turtleclient-setup.exe installer/dist/TurtleClient-Setup.exe
      - name: Sign and verify the bootstrap
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          bun run tauri signer sign installer/dist/TurtleClient-Setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verification = Start-Process -FilePath installer/dist/TurtleClient-Setup.exe -ArgumentList '--verify-file installer/dist/TurtleClient-Setup.exe installer/dist/TurtleClient-Setup.exe.sig' -Wait -PassThru -WindowStyle Hidden
          if ($verification.ExitCode -ne 0) { throw 'The bootstrap signature did not verify with the pinned release key.' }
          $hash = (Get-FileHash installer/dist/TurtleClient-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TurtleClient-Setup.exe" | Set-Content -Encoding ascii installer/dist/TurtleClient-Setup.exe.sha256
      - name: Build signed installer in a draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: TurtleClient Launcher __VERSION__
          releaseBody: |
            Automatischer Windows-x64-Build von TurtleClient Launcher.
            **Erste Installation: TurtleClient-Setup.exe herunterladen.**
            Der native Turtle-Bootstrap lädt die aktuelle Version und prüft ihre Signatur.
            Den Launcher einmal installieren; zukünftige Versionen werden beim Start signiert aktualisiert.
            Die versionsgebundene NSIS-Datei bleibt das Paket für den eingebauten Auto-Updater.
            Quellstand: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: bun run tauri
          args: --ci --bundles nsis --config src-tauri/tauri.release.conf.json -- --locked
      - name: Verify native client update installation
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol --locked --lib turtleclient::update::tests
      - name: Verify automatic Minecraft preparation
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol --locked --lib turtleclient::resources::tests
      - name: Verify bundled sign-in and account handoff
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol --locked --lib engine::accounts::horizon::tests
      - name: Validate and publish the complete update atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: TurtleClient/turtleclient-launcher
        run: |
          gh release download "v$env:RELEASE_VERSION" --pattern latest.json --dir updater-manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/turtle-release.mjs manifest updater-manifest/latest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "v$env:RELEASE_VERSION" updater-manifest/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "v$env:RELEASE_VERSION" installer/dist/TurtleClient-Setup.exe installer/dist/TurtleClient-Setup.exe.sig installer/dist/TurtleClient-Setup.exe.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$env:RELEASE_VERSION" --draft=false --latest
