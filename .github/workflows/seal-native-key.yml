name: Seal native signing key for the client repository
on: workflow_dispatch
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyNaCl==1.6.2
      - name: Seal directly to the destination GitHub repository key
        env:
          SOURCE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from nacl.public import PublicKey,SealedBox
          value=os.environ.pop('SOURCE_KEY')
          if not value:raise SystemExit('The existing signing secret is missing')
          ciphertext=SealedBox(PublicKey(base64.b64decode('QF1tOG78nIzuKEO+a6UAOEuz0LZ8cltU6xbSEv3RTjI='))).encrypt(value.encode())
          Path('sealed-native-key.json').write_text(json.dumps({'key_id':'3380204578043523366','encrypted_value':base64.b64encode(ciphertext).decode()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-native-key
          path: sealed-native-key.json
          retention-days: 1
