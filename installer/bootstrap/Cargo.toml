[package]
name = "turtleclient-setup"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The native TurtleClient bootstrap installer"

[workspace]

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
rfd = { version = "0.15", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
softbuffer = { version = "0.4", default-features = false }
tempfile = "3"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt", "time", "macros"] }
url = "2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
codegen-units = 4
